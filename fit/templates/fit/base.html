<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}FIT App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-lime-400 selection:text-zinc-950">

    <!-- Header / Navbar con Perfiles -->
    <header class="border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-lime-400 rounded-lg flex items-center justify-center text-zinc-950 font-black text-xl tracking-tighter">
                    F
                </div>
                <span class="text-xl font-extrabold tracking-wider uppercase">FIT<span class="text-lime-400">.CORE</span></span>
            </div>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-zinc-400">
                <a href="#" class="hover:text-lime-400 transition-colors">Gestión de Rutinas</a>
                <a href="#" class="hover:text-lime-400 transition-colors">Atletas & Entrenadores</a>
                <a href="#" class="hover:text-lime-400 transition-colors">Indicadores KPIs</a>
                <a href="#" class="hover:text-lime-400 transition-colors">Auditoría</a>
            </nav>

            <div class="flex items-center gap-3">
                <span class="hidden sm:inline-block text-xs bg-zinc-900 border border-zinc-800 text-zinc-400 px-3 py-1.5 rounded-lg font-mono">
                    Rol: Administrador
                </span>
                <a href="#" class="bg-lime-400 hover:bg-lime-300 text-zinc-950 font-bold px-4 py-2 rounded-xl transition-all text-sm">
                    Ingresar
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    {% block contenido %}
    <p>Contenido base.</p>
    {% endblock %}

    <!-- Footer -->
    <footer class="border-t border-zinc-900 py-6 text-center text-zinc-600 text-xs">
        <p>&copy; 2026 FIT Backend System. Sistema Centralizado de Registro y Auditoría.</p>
    </footer>

</body>
</html>
